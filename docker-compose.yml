services:
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    init: true
    environment:
      INSTANCE_PATH: /data/instance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
    expose:
      - "5001"
    volumes:
      - auth-instance:/data/instance
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  shortener:
    build:
      context: .
      dockerfile: shortener/Dockerfile
    init: true
    environment:
      AUTH_BASE_URL: http://auth:5001
      AUTH_TIMEOUT_SECONDS: "2"
      INSTANCE_PATH: /data/instance
      PUBLIC_PATH_PREFIX: /shortener
    expose:
      - "5000"
    volumes:
      - shortener-instance:/data/instance
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      shortener:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  auth-instance:
  shortener-instance:
