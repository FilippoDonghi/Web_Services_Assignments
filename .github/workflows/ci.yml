name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            auth/requirements.txt
            shortener/requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Audit runtime dependencies
        run: |
          pip-audit -r auth/requirements.txt
          pip-audit -r shortener/requirements.txt
      - name: Validate Kubernetes manifests
        run: >-
          kubernetes-validate --strict
          k8s/namespace.yaml
          k8s/auth_deployment.yaml
          k8s/shortener_deployment.yaml
          k8s/nginx_deployment.yaml
      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-only-not-a-deployed-secret-0000000000000000
        run: docker compose config --quiet
      - name: Smoke-test the Compose stack
        env:
          JWT_SECRET: ci-only-not-a-deployed-secret-0000000000000000
        run: |
          docker compose up --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/health
      - name: Stop the Compose stack
        if: always()
        env:
          JWT_SECRET: ci-only-not-a-deployed-secret-0000000000000000
        run: docker compose down --volumes
