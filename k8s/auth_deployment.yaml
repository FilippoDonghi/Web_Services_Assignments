apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: url-shortener
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
      app.kubernetes.io/part-of: url-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: url-shortener
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: url-shortener-auth:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INSTANCE_PATH
              value: /data/instance
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: data
              mountPath: /data/instance
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-data
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: url-shortener
spec:
  selector:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: url-shortener
  ports:
    - name: http
      port: 5001
      targetPort: http
