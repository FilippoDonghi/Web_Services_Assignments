[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"auth/config.py" = ["S104"]
"shortener/config.py" = ["S104"]
"tests/**" = ["S101", "S105"]
